name: Refresh Job Postings

on:
  schedule:
    # Every 30 minutes. Offset from :00/:30, when GitHub's scheduler is busiest.
    - cron: '7,37 * * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Never run two refreshes at once; a slow run delays the next one instead.
concurrency:
  group: refresh-job-postings
  cancel-in-progress: false

jobs:
  refresh-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Run pollers
        env:
          DATABASE_SESSION_POOLER_URL: ${{ secrets.DATABASE_SESSION_POOLER_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LOGO_DEV_PUBLIC_KEY: ${{ secrets.LOGO_DEV_PUBLIC_KEY }}
        run: |
          python -m backend

      - name: Log completion
        run: echo "Job postings refresh completed at $(date)"
