<!-- Written for these tests: a plain careers-site form with the usual mix of
     labelling styles (for=, wrapping label, aria-label, placeholder only, fieldset). -->
<header><h1>Firmware Intern</h1></header>
<form id="apply" action="/submit" method="post">
  <div class="row">
    <label for="fname">First name *</label>
    <input id="fname" name="first" type="text" required>
  </div>
  <div class="row">
    <label for="lname">Last name *</label>
    <input id="lname" name="last" type="text" required>
  </div>
  <div class="row"><label>Email address <input id="mail" type="email" name="contact_email" required></label></div>
  <div class="row"><input id="tel" type="tel" name="tel" aria-label="Phone number"></div>
  <div class="row"><input id="city" type="text" name="city" placeholder="City"></div>
  <div class="row">
    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">Choose...</option>
      <option value="US">United States</option>
      <option value="CA">Canada</option>
      <option value="GB">United Kingdom</option>
    </select>
  </div>
  <div class="row"><label for="li">LinkedIn profile URL</label><input id="li" type="url" name="li"></div>
  <fieldset>
    <legend>Are you legally authorized to work in Canada?</legend>
    <label><input type="radio" name="auth" value="yes"> Yes</label>
    <label><input type="radio" name="auth" value="no"> No</label>
  </fieldset>
  <fieldset>
    <legend>Will you require visa sponsorship to work in Canada?</legend>
    <label><input type="radio" name="sponsor" value="yes"> Yes</label>
    <label><input type="radio" name="sponsor" value="no"> No</label>
  </fieldset>
  <div class="row"><label for="cv">Resume / CV</label><input id="cv" type="file" name="cv"></div>
  <div class="row"><label for="cover">Cover letter</label><textarea id="cover" name="cover"></textarea></div>
  <div class="row"><label><input id="news" type="checkbox" name="news"> Subscribe to our newsletter for future openings</label></div>
  <button type="submit">Submit application</button>
</form>
