<div data-automation-id="applyFlowPage"><div data-automation-id="applyFlowSelfIdentificationPage">
<h2>Voluntary Self-Identification of Disability</h2>

<div data-automation-id="formField-name"><label for="selfIdentifiedDisabilityData--name"><span>Name<abbr aria-hidden="true">*</abbr></span></label>
  <div><input type="text" id="selfIdentifiedDisabilityData--name" name="name" value=""></div></div>

<div data-automation-id="formField-dateSignedOn"><label><span>Date<abbr aria-hidden="true">*</abbr></span></label>
  <div data-automation-id="dateInputWrapper">
    <div><input data-automation-id="dateSectionMonth-input" type="text" role="spinbutton" aria-label="Month"><div data-automation-id="dateSectionMonth-display">MM</div></div>
    <div><input data-automation-id="dateSectionDay-input" type="text" role="spinbutton" aria-label="Day"><div data-automation-id="dateSectionDay-display">DD</div></div>
    <div><input data-automation-id="dateSectionYear-input" type="text" role="spinbutton" aria-label="Year"><div data-automation-id="dateSectionYear-display">YYYY</div></div>
  </div></div>

<div data-automation-id="formField-disabilityStatus"><fieldset><legend><label><span>Please check one of the boxes below:<abbr aria-hidden="true">*</abbr></span></label></legend>
  <div><input type="checkbox" id="d1"><label for="d1">Yes, I have a disability (or previously had a disability)</label></div>
  <div><input type="checkbox" id="d2"><label for="d2">No, I do not have a disability and have not had one in the past</label></div>
  <div><input type="checkbox" id="d3"><label for="d3">I do not want to answer</label></div>
</fieldset></div>

</div></div>
