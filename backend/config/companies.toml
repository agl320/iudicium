# Iudicium source configuration.
#
# Toggle a company with `enabled`, toggle a whole job category with the
# track's `enabled`. Nothing here is secret; secrets stay in the environment.
#
# Run `python -m backend --list` to see what is enabled, and
# `python -m backend --dry-run --company "NVIDIA"` to test a single company
# without touching the database or Discord.

[settings]
# Only postings that match an enabled track are stored / notified.
store_uncategorized = false
# Upper bound on postings fetched per (company, query) pair.
max_jobs_per_query = 200
# How many companies are polled at the same time.
concurrency = 6
# When a company/track pair has never been stored before (new company, new
# track), store its current postings without sending Discord notifications.
seed_silently = true
# Safety net against notification floods from a single company in one run.
max_notifications_per_company = 10


# ---------------------------------------------------------------------------
# Tracks: the job categories we care about. A posting is assigned to the first
# enabled track it matches (in file order).
#
#   employment      "intern"    -> title/provider must indicate a student role
#                   "full_time" -> must not be intern/part-time/contract/temp
#                   "any"       -> no employment requirement
#   priority_titles regexes; a match always puts the title in the track
#   include_titles  regexes; otherwise the title must match one (empty = any)
#   exclude_titles  regexes; ...and must not match any of these
#   block_titles    regexes; a match always keeps the title out of the track
#                   (all regexes are case-insensitive; wrap in (?-i:...) for
#                   case-sensitive parts)
#   search_terms    used by providers that only return keyword-search results
#                   (Workday, Eightfold, AMD, Oracle). Keep them specific:
#                   Workday ORs the words and also searches descriptions, so
#                   e.g. "people" or "co-op" match nearly every posting.
#   color           Discord embed colour (and frontend badge colour)
# ---------------------------------------------------------------------------

[tracks.hr]
enabled = true
label = "HR / HRIS / Payroll"
color = "#EC4899"
employment = "full_time"
include_titles = [
  # Core HR
  '\bhr\b',
  '\bhrbp\b',
  'human resources?',
  'human capital',
  '\bpeople\b(?! (manager|leader|with))',
  '\bpersonnel\b',
  'employee (relations|experience|services|lifecycle|engagement|communications|success|benefits|listening)',
  'labou?r relations',
  '\bdei\b',
  'diversity',
  # HRIS / HR tech
  '\bhris\b',
  'hcm (analyst|specialist|administrator|systems?|lead|manager)',
  'workday (hcm|hris|analyst|payroll|integrations?|administrator|specialist|systems?)',
  'successfactors',
  '\bukg\b',
  'kronos',
  'dayforce',
  'ceridian',
  # Payroll, comp & benefits
  '\bpayroll\b',
  'compensation',
  '(total|global|people) rewards',
  'rewards (specialist|partner|analyst|manager|program|lead)',
  '\bbenefits\b',
  'leaves? of absence',
  '\bloa\b',
  'global mobility',
  'immigration',
  # Talent
  'talent (acquisition|management|development|operations|ops|brand|sourc\w*|partner|programs?|manager|insights|attraction|advisor|specialist|lead|strategy)',
  'head of talent',
  '\brecruit(er|ers|ing|ment)\b',
  '\bsourcer\b',
  'learning (&|and) development',
  '\bl&d\b',
  'workforce (development|planning|management|analytics)',
  'organi[sz]ational (development|effectiveness|design)',
]
exclude_titles = [
  # Employment lawyers are legal, not HR.
  '\b(counsel|attorney|lawyer|paralegal)\b',
  # Finance roles that merely mention HR (e.g. "Director, Finance - G&A/HR");
  # payroll roles often sit in finance, so those still count.
  '^(?!.*payroll).*financ',
  # Building HR software is engineering, not HR.
  'software', 'machine learning', 'scientist', 'developer', 'full[- ]?stack',
  '\barchitect\b', 'technical (program|director)', 'customer support',
  # Selling HR software (Workday, SAP, Oracle HCM) is sales, not HR.
  'solutions? (consultant|engineer|architect|specialist)', 'pre-?sales',
  '(functional|implementation|technical) consultant', 'product (instructor|trainer)',
  'account (executive|manager)', '\bproduct (manager|marketing)',
]
search_terms = [
  "HR",
  "human resources",
  "HRIS",
  "HRBP",
  "payroll",
  "talent acquisition",
  "sourcer",
  "total rewards",
  "global mobility",
  "workforce development",
  "workday",
]

[tracks.tech_intern]
enabled = true
label = "Tech intern"
color = "#0BBEFE"
employment = "intern"
# Unmistakably technical: counts even if an exclude below also matches
# (e.g. "Manufacturing Software Intern").
priority_titles = [
  # Software & infrastructure
  'software', '\bsw\b', 'developer', '\bdev\b', 'devops', 'devsecops', 'mlops',
  '\bsre\b', 'site reliability', 'reliability engineer', '\binfra(structure)?\b',
  '\bcloud\b', 'platform',
  'full[- ]?stack', '\bmobile\b', '\bios\b', 'android', '\bweb\b', '\bapis?\b',
  '\bsdk\b', 'compiler', 'kernel', '\blinux\b', 'operating systems?',
  'distributed', 'database', 'automation', '\bqa\b', 'quality assurance',
  '\btest (engineer|automation|development)', 'release engineer', 'tooling',
  'programm(er|ing)', 'coding', 'computer', 'computing',
  # Data & AI
  '\bdata\b', 'machine learning', 'deep learning', '\bml\b',
  '\bai\b', 'genai', 'artificial intelligence', '\bllms?\b', 'large language',
  'computer vision', '\bnlp\b', 'robot', 'autonomous', 'algorithm',
  # Security, networking & IT
  'security', 'cyber', 'network', '(?-i:\bIT\b)', 'information (technology|systems|security)',
  # Hardware, silicon & embedded
  'hardware', 'firmware', 'embedded', '\bfpga\b', '\basic\b', '\brtl\b',
  '\bsoc\b', '\bgpu\b', '\bcpu\b', '\bnpu\b', '\beda\b', '\bdft\b', '\bvlsi\b',
  'verification', 'validation', 'physical design', 'silicon', '\bchip\b',
  'circuit', 'analog', 'mixed[- ]signal', '\bserdes\b', 'signal (integrity|processing)',
  '\bdsp\b', '\brf\b', 'photonic', 'electronic',
  '(ic|layout|memory|logic|digital|chip|asic|soc) design', 'design (engineer|verification)',
  'functional safety',
  '\besd\b', '\bams\b', '\btcad\b', 'design for test',
  'device model', 'error correction', 'sensor fusion', 'sensing', '\bserver',
  'digital twin', 'characteri[sz]ation', '\bcamera\b', '\blogic\b',
  'power (analysis|optimi[sz]ation|management|integrity|modell?ing)', 'low[- ]power',
  '\barchitect(ures?)?\b', 'performance (engineer|model|analysis|architect)', 'quantum',
  'librar(y|ies)', 'linear algebra', 'simulation',
  # Product & design
  'product manag', 'product design', 'technical program', '\bux\b', '\bui\b',
  'user experience',
  # Non-English postings (stage / estágio = internship)
  'logiciel', 'embarqu', 'informatique', 'intelligence artificielle', '\bia\b',
  'donn[ée]es', 'dados',
]
# Generic engineering/research titles count unless they look non-technical.
include_titles = [
  'engineer', 'ingénieur', 'technical', '\btech\b', 'technolog', 'research',
  'scientist', 'science', 'product development', 'modell?ing',
  '\bsystems?\b', 'analytics', 'back[- ]?end', 'front[- ]?end', 'electrical',
  '\bdram\b', '\bnand\b', '\bsram\b', '\bnvm\b', '\bhbm\b', '\bssd\b',
]
exclude_titles = [
  # Business functions
  'non[- ]technical', 'financ', 'treasury', 'accounting', 'accountant', 'audit', '\btax\b', 'sales', '\bbdr\b',
  'marketing', 'legal', 'counsel', 'strategy', 'business development',
  'procurement', 'supplier', 'sourcing', 'supply chain', 'purchasing',
  '\bcomms\b', 'corporate communications', 'customer experience', 'operations associate',
  # Fab, facilities and non-electronic engineering
  'facilit', '\bbuildings?\b', 'real estate', 'mechanic', 'mechatronic', 'chemi', 'civil',
  'structural', 'industrial engineer', 'environmental', '\behs\b',
  'process (engineer|integration|development|technician|control|safety)',
  'equipment', 'manufacturing', '\bfab\b', 'technician', 'module engineer',
  'etch', '\bcvd\b', '\bpvd\b', '\bcmp\b', 'lithograph', 'photomask',
  'diffusion', 'implant', 'thin films?', 'yield',
]
# HR internships are not wanted (HR is full-time only), even "HR Analytics".
block_titles = [
  '\bhr\b', '\bhris\b', 'human resources?', '\bpayroll\b', 'recruit', 'talent',
  'physical\W*security', '\bdc security\b', 'campus security', 'business develop',
]
search_terms = ["intern", "internship", "student"]


# ---------------------------------------------------------------------------
# Companies
#
# Common keys: name, enabled, provider, domain (used for logos)
#
# provider = "workday"          host, site
# provider = "greenhouse"       board
# provider = "ashby"            board
# provider = "smartrecruiters"  board
# provider = "oraclecloud"      host, site
# provider = "eightfold"        host, domain_param, job_url_template
# provider = "amd"              (careers.amd.com)
# provider = "amazon"           (amazon.jobs)
# provider = "apple"            (jobs.apple.com)
# provider = "google"           (Google Careers)
# provider = "sap"              (jobs.sap.com)
# provider = "successfactors"   host (SAP SuccessFactors career site RSS)
# provider = "avature"          search_url (Avature career site search page)
#   amazon/apple/google/avature also accept max_pages (newest-first paging)
# provider = "custom"           client = "module.path:ClassName" exposing
#                               search_job_postings() -> list[JobPosting]
#
# Workday facets (intern / full-time) are resolved by label at runtime, so no
# per-company facet ids are needed. Override with
#   facets.<track> = { workerSubType = ["<id>"] }
# if a company's labels are unusual.
# ---------------------------------------------------------------------------

