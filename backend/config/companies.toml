# Iudicium source configuration.
#
# Toggle a company with `enabled`, toggle a whole job category with the
# track's `enabled`. Nothing here is secret; secrets stay in the environment.
#
# Run `python -m backend --list` to see what is enabled, and
# `python -m backend --dry-run --company "NVIDIA"` to test a single company
# without touching the database or Discord.

[settings]
# Only postings that match an enabled track are stored / notified.
store_uncategorized = false
# Upper bound on postings fetched per (company, query) pair.
max_jobs_per_query = 200
# How many companies are polled at the same time.
concurrency = 6
# When a company/track pair has never been stored before (new company, new
# track), store its current postings without sending Discord notifications.
seed_silently = true
# Safety net against notification floods from a single company in one run.
max_notifications_per_company = 10


# ---------------------------------------------------------------------------
# Tracks: the job categories we care about. A posting is assigned to the first
# enabled track it matches (in file order).
#
#   employment     "intern"    -> title/provider must indicate a student role
#                  "full_time" -> must not be intern/part-time/contract/temp
#                  "any"       -> no employment requirement
#   include_titles regexes (case-insensitive); empty = any title
#   exclude_titles regexes (case-insensitive)
#   search_terms   used by providers that only return keyword-search results
#                  (Workday, Eightfold, AMD, Oracle). Keep them specific: many
#                  boards also search descriptions.
#   color          Discord embed colour (and frontend badge colour)
# ---------------------------------------------------------------------------

[tracks.hr]
enabled = true
label = "HR / HRIS / Payroll"
color = "#EC4899"
employment = "full_time"
include_titles = [
  '\bhr\b',
  '\bhris\b',
  '\bhrbp\b',
  '\bhcm\b',
  'human resources?',
  'human capital',
  '\bpayroll\b',
  'people (operations|ops|partner|business partner|analytics|systems|technology|programs?|services|experience)',
  'people (&|and) culture',
  'compensation',
  'total rewards',
  '\bbenefits\b',
  'employee relations',
  'talent (acquisition|management)',
  '\brecruit(er|ing)\b',
]
exclude_titles = []
search_terms = ["HR", "human resources", "HRIS", "payroll", "talent acquisition"]

[tracks.tech_intern]
enabled = true
label = "Tech intern"
color = "#0BBEFE"
employment = "intern"
include_titles = []
# HR internships are not wanted (HR is full-time only).
exclude_titles = ['\bhr\b', '\bhris\b', 'human resources?', '\bpayroll\b']
search_terms = ["intern", "co-op"]


# ---------------------------------------------------------------------------
# Companies
#
# Common keys: name, enabled, provider, domain (used for logos)
#
# provider = "workday"          host, site
# provider = "greenhouse"       board
# provider = "ashby"            board
# provider = "smartrecruiters"  board
# provider = "oraclecloud"      host, site
# provider = "eightfold"        host, domain_param, job_url_template
# provider = "amd"              (careers.amd.com)
# provider = "custom"           client = "module.path:ClassName" exposing
#                               search_job_postings() -> list[JobPosting]
#
# Workday facets (intern / full-time) are resolved by label at runtime, so no
# per-company facet ids are needed. Override with
#   facets.<track> = { workerSubType = ["<id>"] }
# if a company's labels are unusual.
# ---------------------------------------------------------------------------

